<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三年级英语同步学习 — 教材帮 RP · 2025 秋</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <svg width="36" height="36"><use href="assets/img/mascot-star.svg#star"/></svg>
        英语同步学
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="grade3.html" class="active">三年级</a>
      </div>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="container">
      <!-- Breadcrumb -->
      <div class="breadcrumb">
        <a href="index.html">首页</a>
        <span>›</span>
        <span>三年级</span>
      </div>

      <!-- Grade Banner -->
      <section class="hero" style="padding:2rem 1rem">
        <h1>📗 人教版 RP · 三年级上册</h1>
        <p>2025 秋 · 6 个单位 + 复习</p>
        <div id="grade-progress" style="margin-top:1rem;font-size:.95rem;color:var(--c-gray)">加载中…</div>
        <div class="progress-bar" style="max-width:400px;margin:.5rem auto 0">
          <div class="progress-bar__fill" id="overall-bar" style="width:0%"></div>
        </div>
      </section>

      <!-- Unit Grid -->
      <section class="section section--tight">
        <div class="grid-3" id="unit-grid" style="gap:1.25rem"></div>
      </section>

      <!-- Revision -->
      <section class="section section--tight" style="text-align:center" id="revision-section"></section>
    </div>
  </main>

  <script type="module">
    import { Progress } from './assets/js/core/progress.js';

    const res = await fetch('data/grade3/meta.json');
    const meta = await res.json();

    const totalSectionsMap = meta.totalSections;
    const unitIds = meta.units.map(u => u.id);
    const allIds = [...unitIds, meta.revision.id];
    const allMap = { ...totalSectionsMap, [meta.revision.id]: totalSectionsMap.rev || 6 };
    const gp = Progress.getGradeProgress(3, allIds, allMap);

    // Overall progress
    const totalDone = gp.reduce((s, u) => s + u.completed.length, 0);
    const totalAll = Object.values(allMap).reduce((s, n) => s + n, 0);
    const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
    document.getElementById('grade-progress').textContent = `整体进度：${overallPct}%（${totalDone}/${totalAll} 项完成）`;
    document.getElementById('overall-bar').style.width = `${overallPct}%`;

    // Unit cards
    const grid = document.getElementById('unit-grid');
    for (let i = 0; i < meta.units.length; i++) {
      const u = meta.units[i];
      const p = gp.find(x => x.unitId === u.id);
      const pct = Math.round((p?.progress || 0) * 100);
      const total = totalSectionsMap[u.id] || 10;
      const status = pct >= 100 ? '✅ 已完成' : pct > 0 ? `继续学习（${pct}%）` : '开始学习';

      const card = document.createElement('div');
      card.className = `card ${u.coming ? 'card--disabled' : 'card--clickable'}`;
      card.style.borderTop = `5px solid ${u.color}`;
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:.5rem">
          <span class="badge badge--unit" style="background:${u.color}">Unit ${u.number}</span>
          <span style="font-size:1.6rem">${u.icon}</span>
        </div>
        <h3 style="font-size:1.2rem">${u.titleEn}</h3>
        <p style="font-size:.9rem;color:var(--c-gray)">${u.titleZh}</p>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0">
          <small style="background:var(--c-gray3);padding:.15rem .5rem;border-radius:10px">A: ${u.partA}</small>
          <small style="background:var(--c-gray3);padding:.15rem .5rem;border-radius:10px">B: ${u.partB}</small>
          <small style="background:var(--c-gray3);padding:.15rem .5rem;border-radius:10px">C: ${u.partC}</small>
        </div>
        <div class="progress-bar" style="margin:.5rem 0">
          <div class="progress-bar__fill" style="width:${pct}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--c-gray)">
          <span>${p.completed.length} / ${total} 项完成</span>
          ${p.score ? `<span>📝 ${p.score.correct}/${p.score.total}</span>` : ''}
        </div>
        <div style="margin-top:.75rem">
          ${u.coming
            ? '<button class="btn btn-outline btn-sm" disabled>敬请期待</button>'
            : `<a href="${u.url}" class="btn ${pct >= 100 ? 'btn-green' : 'btn-primary'} btn-sm">${status}</a>`
          }
        </div>
      `;
      grid.appendChild(card);
    }

    // Revision section
    const rev = meta.revision;
    const revP = gp.find(x => x.unitId === rev.id);
    const revPct = Math.round((revP?.progress || 0) * 100);
    const revSec = document.getElementById('revision-section');
    revSec.innerHTML = `
      <h3 style="margin-bottom:.5rem">🔁 期末复习</h3>
      <div class="card" style="max-width:400px;margin:0 auto;border-top:5px solid var(--c-ink)">
        <span style="font-size:1.6rem">${rev.icon}</span>
        <h3 style="font-size:1.1rem">${rev.titleEn}</h3>
        <p style="font-size:.85rem;color:var(--c-gray)">${rev.titleZh}</p>
        <div class="progress-bar" style="margin:.5rem 0"><div class="progress-bar__fill" style="width:${revPct}%"></div></div>
        <button class="btn btn-outline btn-sm" disabled>敬请期待</button>
      </div>
    `;
  </script>
</body>
</html>
